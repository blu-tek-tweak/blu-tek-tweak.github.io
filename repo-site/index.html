<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blu-tek source</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #000035;
            color: #fff;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #888;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        .source-buttons {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }
        .source-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem;
            border-radius: 1rem;
            background: #111;
            text-decoration: none;
            color: #fff;
            transition: background 0.2s ease;
        }
        .source-button:hover {
            background: #222;
        }
        .source-button img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }
        .source-button span {
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>blu-tek source</h1>
        <p>Add this source to your package manager</p>
        <div class="source-buttons">
            <a class="source-button" href="sileo://source/https://blu-tek-tweak.github.io/repo/">
                <img src="/sileo.png" alt="Sileo">
                <span>Sileo</span>
            </a>
            <a class="source-button" href="zbra://sources/https://blu-tek-tweak.github.io/repo/">
                <img src="/zebra.png" alt="Zebra">
                <span>Zebra</span>
            </a>
        </div>
    </div>
</body>
</html>
